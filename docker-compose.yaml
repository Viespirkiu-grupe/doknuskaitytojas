services:
  unoserver:
    image: libreofficedocker/libreoffice-unoserver:3.21
    container_name: viesunoserver
    restart: unless-stopped
    ports:
      - "2004:2004"

  viesdoknuskaitytojas:
    build: .
    image: viesdoknuskaitytojas
    container_name: viesdoknuskaitytojas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - UNOSERVER_HOST=unoserver
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      - unoserver
